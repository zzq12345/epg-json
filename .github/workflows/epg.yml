name: EPG

on:
  schedule:
    - cron: 0 4,10,22 * * *
    - cron: 39 15,16 * * *
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - url: https://epg.112114.xyz/pp.xml.gz
            branch: 112114
            sleep: 0s
          - url: https://raw.githubusercontent.com/zzq12345/tvepg/refs/heads/main/epgmytvsuper.xml
            branch: main  # 确保这里有正确的branch
            sleep: 30s
          #- url: http://epg.51zmt.top:8000/e.xml
          #  branch: 51zmt
          #  sleep: 60s

    steps:
     

      - name: checkout code
        uses: actions/checkout@v4
        if: ${{ env.isDiff }}
        with:
          ref: ${{ matrix.branch }}
          path: epg

      - uses: actions/setup-python@v5
        if: ${{ env.isDiff }}
        with:
          python-version: '3.12' 

      - name: xml to json
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          mkdir ./xml ./json
          mv -f ../e.xml ./xml/e.xml
          pip install -r requirements.txt
          python xml2json.py

      - name: move file
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          now_date=$(date -u -d '+8 hour' '+%Y-%m-%d')
          mv -f ./xml/e.xml ./xml/${{ matrix.branch }}.xml
          mv -f ./json/e.json ./json/${{ matrix.branch }}.json
          echo "${{ env.isDiff }}" > ./md5.txt
          sleep ${{ matrix.sleep }}

      - uses: ncipollo/release-action@v1
        if: ${{ env.isDiff }}
        with:
          tag: ${{ env.tag }}
          body: "更新时间: ${{ env.now_time }}"
          allowUpdates: true
          artifacts: |
            epg/xml/*.xml
            epg/json/*.json

      - name: Commit
        if: ${{ env.isDiff }}
        working-directory: epg
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          sed "2c * 更新时间: ${{ env.now_time }}" README.md -i
          rm -rf ./xml
          rm -rf ./json
          git add --all
          git commit -m "${{ env.now_time }}"
          git push -f origin ${{ matrix.branch }}
